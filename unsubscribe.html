<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>가락랜드 광고 수신거부</title><style>body{font-family:system-ui,sans-serif;background:#f5f8f4;color:#143d30;margin:0;display:grid;place-items:center;min-height:100vh}main{background:white;width:min(500px,90vw);padding:35px;border-radius:18px;box-shadow:0 14px 60px #143d301c}h1{margin-top:0}p{line-height:1.6;color:#52685f}select,button{width:100%;padding:13px;border:1px solid #bad6c5;border-radius:8px;margin:8px 0}button{background:#056c4e;color:white;font-weight:800;cursor:pointer}</style><link rel="icon" href="/assets/brand/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png"><link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png"><meta property="og:type" content="website"><meta property="og:site_name" content="가락한상"><meta property="og:image" content="https://garakland.lexid.site/assets/brand/og-image.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="가락한상 마스코트 — 가락시장 30년 전통의 맛"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://garakland.lexid.site/assets/brand/og-image.jpg"><meta property="og:url" content="https://garakland.lexid.site/unsubscribe.html"><meta property="og:title" content="가락랜드 광고 수신거부"><meta name="twitter:title" content="가락랜드 광고 수신거부"></head><body><main><h1>가락랜드 광고 수신거부</h1><p>메시지에 포함된 링크로 방문했다면 아래에서 철회할 매체를 선택하세요. 광고 수신거부는 결제나 회원 탈퇴와 별개입니다.</p><label>수신거부 매체<select id="channel"><option value="all">모든 채널</option><option value="email">이메일</option><option value="sms">문자</option><option value="kakao">카카오톡</option></select></label><button id="withdraw">광고 수신 철회</button><p id="result" role="status"></p><a href="/market.html">가락랜드 돌아가기</a></main><script>const q=new URLSearchParams(location.search);if(['all','email','sms','kakao'].includes(q.get('channel')))document.querySelector('#channel').value=q.get('channel');document.querySelector('#withdraw').onclick=async()=>{const p=document.querySelector('#result');try{const r=await fetch('/api/v5/optout',{method:'POST',headers:{'Content-Type':'application/json','X-Garak-Client':'1'},body:JSON.stringify({token:q.get('token'),channel:document.querySelector('#channel').value})});const data=await r.json();p.textContent=r.ok?data.message:data.error}catch(e){p.textContent='네트워크를 확인해 주세요.'}};</script></body></html>
