name: Garakland After-Lotte Production Read-only Smoke
on:
  push:
    branches:
      - feature/garakland-indoor-map-20261102
    paths:
      - 'tests/marketing_live_smoke.py'
      - '.github/workflows/garakland-marketing-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-get-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Check production pages, imagery and 3D controls (GET only)
        env:
          GARAKLAND_BASE_URL: https://garakland.lexid.site
        run: python tests/marketing_live_smoke.py
