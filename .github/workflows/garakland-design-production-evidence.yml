name: Garakland production design release evidence
on:
  push:
    branches:
      - release/garakland-design-20261102
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Validate deployed HTML/CSS/images and public health (GET only)
        run: python tests/production_design_readonly.py

  source-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive exact verified production commit
        env:
          RELEASE_SHA: 58cab8366b7880f6233be5344073892235ab2f6e
        run: |
          mkdir -p release
          git cat-file -e "$RELEASE_SHA^{commit}"
          git archive --format=zip --prefix=GARAKLAND_DESIGN_PRODUCTION_20261102/ -o release/GARAKLAND_DESIGN_PRODUCTION_20261102.zip "$RELEASE_SHA"
          (cd release && sha256sum GARAKLAND_DESIGN_PRODUCTION_20261102.zip > GARAKLAND_DESIGN_PRODUCTION_20261102.sha256)
      - name: Upload auditable deployed source ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: garakland-20261102-production-source
          path: release/
          retention-days: 30
