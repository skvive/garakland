name: Garakland Indoor Navigation Beta QA

on:
  push:
    branches:
      - feature/garakland-indoor-map-20261102
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-and-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Floor-model rules and verified-confidence metadata
        run: node tests/indoor_nav.test.mjs
      - name: Rights-gated floor geometry and accessible route regression
        run: node tests/indoor_layout_schema.test.mjs
      - name: Validate cross-floor routing and accessibility proof gates
        run: node tests/indoor_campus_graph.test.mjs
      - name: Validate all HTML/CSS links and JS syntax
        run: python scripts/web_quality_gate.py

  real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install Chromium for isolated static site
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test 6 floors and all user navigation actions at three viewports
        run: python tests/browser_indoor_qa.py
      - name: Save floor-map evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: garakland-indoor-floor-12-screens
          path: qa-artifacts/indoor/
          if-no-files-found: warn
          retention-days: 14

  source-package:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Archive exact Git source for reproducible delivery
        run: |
          mkdir -p release
          git archive --format=zip --prefix=GARAKLAND_INDOOR_BETA/ -o release/GARAKLAND_INDOOR_BETA_SOURCE.zip HEAD
          (cd release && sha256sum GARAKLAND_INDOOR_BETA_SOURCE.zip > GARAKLAND_INDOOR_BETA_SOURCE.sha256)
      - name: Upload complete-source delivery package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: garakland-indoor-beta-source
          path: release/
          retention-days: 30
