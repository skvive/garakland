name: Garakland Web QA (isolated demo)

on:
  push:
    branches:
      - chatgpt/garakland-web-workspace-20261101
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install 'pg8000>=1.31,<2' requests playwright pillow
      - name: Static links, assets, JS syntax
        run: python scripts/web_quality_gate.py
      - name: Python backend and API regression
        env:
          GARAK_ENABLE_DEMO: '1'
          GARAK_V5_LIVE_MARKETING: '0'
          GARAK_V5_APPROVED_LIVE_SEND: NO
          DATABASE_URL: ''
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Navigation JS regression
        run: node tests/test_navigation.mjs

  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install browser and API test dependencies
        run: |
          python -m pip install 'pg8000>=1.31,<2' playwright requests
          python -m playwright install --with-deps chromium
      - name: Browser desktop/mobile 26-page route and safe click QA
        env:
          GARAK_ENABLE_DEMO: '1'
          GARAK_V5_LIVE_MARKETING: '0'
          GARAK_V5_APPROVED_LIVE_SEND: NO
          DATABASE_URL: ''
        run: python tests/browser_site_acceptance.py
