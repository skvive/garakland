name: Garakland Web QA (isolated demo)

on:
  push:
    branches:
      - chatgpt/garakland-web-workspace-20261101
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install 'pg8000>=1.31,<2' requests playwright pillow
      - name: Static links, assets, JS syntax
        run: python scripts/web_quality_gate.py
      - name: Python backend and API regression
        env:
          GARAK_ENABLE_DEMO: '1'
          GARAK_V5_LIVE_MARKETING: '0'
          GARAK_V5_APPROVED_LIVE_SEND: NO
          DATABASE_URL: ''
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Navigation JS regression
        run: node tests/test_navigation.mjs

  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install browser and API test dependencies
        run: |
          python -m pip install 'pg8000>=1.31,<2' playwright requests
          python -m playwright install --with-deps chromium
      - name: Browser desktop/mobile 26-page route and safe click QA
        env:
          GARAK_ENABLE_DEMO: '1'
          GARAK_V5_LIVE_MARKETING: '0'
          GARAK_V5_APPROVED_LIVE_SEND: NO
          QA_CAPTURE_SCREENSHOTS: '1'
          DATABASE_URL: ''
        run: python tests/browser_site_acceptance.py
      - name: Upload browser screenshot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: garakland-52-page-screenshots
          path: qa/screenshots/
          if-no-files-found: warn
          retention-days: 7

  live-readonly:
    name: Production public API read-only health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Probe 7 safe GET endpoints (no credentials or mutations)
        env:
          GARAK_READONLY_BASE: https://garakland.lexid.site
        run: python tests/live_readonly_smoke.py

  source-release:
    name: Source and QA docs archive
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Package exact tracked QA branch
        run: |
          mkdir -p release
          git archive --format=zip --prefix=GARAKLAND_QA_SOURCE/ --output=release/GARAKLAND_QA_SOURCE_20261102.zip HEAD
          sha256sum release/GARAKLAND_QA_SOURCE_20261102.zip > release/GARAKLAND_QA_SOURCE_20261102.sha256
      - name: Upload auditable source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: garakland-full-source-qa
          path: release/
          retention-days: 30
