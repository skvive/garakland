name: Garakland Android APK and emulator QA

on:
  push:
    branches:
      - 'chatgpt/garakland-android-workspace-*'
    paths:
      - 'android/**'
      - '.github/workflows/garakland-android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/garakland-android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk-build:
    name: Android static checks + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK and run unit tests
        run: gradle -p android :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: garakland-android-debug-and-reports
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  emulator-smoke:
    name: API 35 Android emulator installation + smoke test
    runs-on: ubuntu-latest
    needs: apk-build
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch Android emulator and execute device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            gradle -p android :app:connectedDebugAndroidTest --stacktrace
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n site.lexid.garakland/.MainActivity
            sleep 12
            mkdir -p android/app/build/emulator-screenshots
            adb exec-out screencap -p > android/app/build/emulator-screenshots/garakland-api35.png
            adb logcat -d -t 2000 > android/app/build/emulator-screenshots/logcat-after-launch.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: garakland-android-emulator-test-results
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/emulator-screenshots/
          if-no-files-found: warn
          retention-days: 14
