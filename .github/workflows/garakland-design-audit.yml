name: Garakland Visual QA · all pages

on:
  push:
    branches:
      - 'chatgpt/garakland-android-workspace-*'
      - 'release/garakland-design-20261102'
    paths:
      - '*.html'
      - 'design/**'
      - 'brand/**'
      - 'src/**'
      - 'game/**'
      - 'market/**'
      - 'ops/**'
      - 'hub/**'
      - 'tests/delivery_page_audit.py'
      - 'scripts/web_quality_gate.py'
      - 'brand_strategy_docs/**'
      - '.github/workflows/garakland-design-audit.yml'
  workflow_dispatch:
    inputs:
      strict:
        description: 'Fail on missing images, HTTP error, or page horizontal scroll'
        type: boolean
        default: false

permissions:
  contents: read
jobs:
  page-by-page:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright pg8000
      - name: Validate HTML/CSS assets and JavaScript syntax
        run: python scripts/web_quality_gate.py
      - name: Assert Garakland theme park branding and 3D routing
        run: python -m unittest discover -s tests -p 'test_themepark_brand.py' -v
      - run: python -m playwright install --with-deps chromium
      - name: Render 18 routes × desktop/mobile/compact and record defects
        run: python tests/delivery_page_audit.py --strict
      - name: Save screenshot + measurable browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garakland-18-pages-design-qa
          path: qa-artifacts/design-delivery/
          if-no-files-found: warn
          retention-days: 14
