name: LogShield Android APK (isolated build)
on:
  push:
    branches:
      - chatgpt/logshield-apk-build-20261101
    paths:
      - 'logshield-mobile/**'
      - '.github/workflows/logshield-apk-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK platform 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build installable debug APK
        working-directory: logshield-mobile
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Lint report
        working-directory: logshield-mobile
        run: gradle --no-daemon :app:lintDebug
      - name: APK metadata and integrity
        run: |
          APK=logshield-mobile/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" | tee logshield-mobile/LOGSHIELD_DEBUG_APK.sha256
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee logshield-mobile/APK_SIGNATURE_VERIFIED.txt
          unzip -l "$APK" | head -25
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LogShield-Android-Installable-Debug-APK
          path: |
            logshield-mobile/app/build/outputs/apk/debug/app-debug.apk
            logshield-mobile/LOGSHIELD_DEBUG_APK.sha256
            logshield-mobile/APK_SIGNATURE_VERIFIED.txt
            logshield-mobile/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 30

  emulator-smoke:
    name: Android API35 emulator install and launch
    needs: android-debug-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v4
      - uses: actions/download-artifact@v4
        with:
          name: LogShield-Android-Installable-Debug-APK
          path: logshield-apk-artifact
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and capture Android app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            ROOT="$GITHUB_WORKSPACE"
            QA="$ROOT/logshield-emulator-qa"
            mkdir -p "$QA"
            ls -la "$ROOT/logshield-apk-artifact"
            APK="$(find "$ROOT/logshield-apk-artifact" -type f -name '*.apk' -print -quit)"
            test -s "$APK"
            adb install -r "$APK" | tee "$QA/install.txt"
            adb shell am start -n site.lexid.logshield/.MainActivity | tee "$QA/launch.txt"
            sleep 10
            adb shell pidof site.lexid.logshield | tee "$QA/app-pid.txt"
            adb exec-out screencap -p > "$QA/launch-screenshot.png"
            adb logcat -d -t 1200 > "$QA/logcat.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LogShield-Android-Emulator-Smoke-QA
          path: logshield-emulator-qa/
          if-no-files-found: warn
          retention-days: 30
