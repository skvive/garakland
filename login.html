<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#073e32">
  <title>로그인 · 가락한상</title>
  <link rel="icon" href="/assets/brand/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="가락한상">
  <meta property="og:url" content="https://garakland.lexid.site/login.html">
  <meta property="og:title" content="로그인 · 가락한상">
  <meta property="og:image" content="https://garakland.lexid.site/assets/brand/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="가락한상 마스코트 — 가락시장 30년 전통의 맛">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="로그인 · 가락한상">
  <meta name="twitter:image" content="https://garakland.lexid.site/assets/brand/og-image.jpg">
  <link rel="stylesheet" href="/design/tokens.css">
  <link rel="stylesheet" href="/design/components.css">
  <link rel="stylesheet" href="/design/brand.css">
  <link rel="stylesheet" href="/auth/login.css">
</head>
<body class="auth-page" data-gl-mobile-nav="off">
  <div class="auth-shell">
    <div class="auth-card">
      <a class="auth-brand" href="/">
        <img class="gl-logo-header" src="/assets/brand/garakland-logo-header.webp" alt="가락랜드" width="170" height="56">
      </a>
      <div id="loggedPanel" hidden class="auth-logged">
        <h1>로그인됨</h1>
        <p class="sub">쿠폰·탐험 기록과 연동 준비 중입니다.</p>
        <p class="email" id="userEmail"></p>
        <button type="button" class="primary" id="signOutBtn">로그아웃</button>
        <a class="auth-back" href="/market.html">특가·쿠폰으로 이동 ↗</a>
      </div>
      <form id="authForm">
        <h1 id="authTitle">가락한상 계정 만들기</h1>
        <p class="sub">Google 계정으로 바로 로그인하거나, 이메일로 시연 계정을 만들 수 있습니다. 실결제·실명 검증과 별개입니다.</p>
        <button type="button" class="google" id="googleBtn">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 16.3 4 9.6 8.4 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-7.9l-6.5 5C9.5 39.5 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.2-3.5 5.8-6.6 7.5l6.3 5.3C38.2 37.3 44 32 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
          Google로 계속하기
        </button>
        <div class="auth-divider" role="separator"><span>또는 이메일</span></div>
        <label for="email">이메일</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" placeholder="8자 이상">
        <button type="submit" class="primary" id="authSubmit">이메일로 가입</button>
        <p class="auth-toggle" id="modeSignInWrap">이미 계정이 있나요? <button type="button" id="modeSignInBtn">로그인</button></p>
        <p class="auth-toggle" id="modeSignUpWrap" hidden>처음이신가요? <button type="button" id="modeSignUpBtn">가입하기</button></p>
        <p id="authMsg" class="auth-msg" role="status"></p>
        <p class="auth-note">Powered by Neon Managed Better Auth. 가입 시 neon_auth 스키마에 프로필이 동기화됩니다.</p>
      </form>
      <a class="auth-back" href="/">← 가락한상 홈</a>
    </div>
  </div>
  <script type="module" src="/auth/login.mjs"></script>
</body>
</html>
