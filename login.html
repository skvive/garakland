<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#073e32">
  <title>로그인 · 가락랜드</title>
  <link rel="icon" href="/assets/icon.svg">
  <link rel="stylesheet" href="/design/tokens.css">
  <link rel="stylesheet" href="/design/components.css">
  <link rel="stylesheet" href="/auth/login.css">
</head>
<body class="auth-page" data-gl-mobile-nav="off">
  <div class="auth-shell">
    <div class="auth-card">
      <a class="auth-brand" href="/">
        <span aria-hidden="true">◈</span>
        <span><b>가락랜드</b><small>Neon Auth · 베타 계정</small></span>
      </a>
      <div id="loggedPanel" hidden class="auth-logged">
        <h1>로그인됨</h1>
        <p class="sub">쿠폰·탐험 기록과 연동 준비 중입니다.</p>
        <p class="email" id="userEmail"></p>
        <button type="button" class="primary" id="signOutBtn">로그아웃</button>
        <a class="auth-back" href="/market.html">특가·쿠폰으로 이동 ↗</a>
      </div>
      <form id="authForm">
        <h1 id="authTitle">가락랜드 계정 만들기</h1>
        <p class="sub">이메일·비밀번호로 로그인합니다. 시연 서비스용 계정이며 실결제·실명 검증과 별개입니다.</p>
        <label for="email">이메일</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" placeholder="8자 이상">
        <button type="submit" class="primary" id="authSubmit">이메일로 가입</button>
        <p class="auth-toggle" id="modeSignInWrap">이미 계정이 있나요? <button type="button" id="modeSignInBtn">로그인</button></p>
        <p class="auth-toggle" id="modeSignUpWrap" hidden>처음이신가요? <button type="button" id="modeSignUpBtn">가입하기</button></p>
        <p id="authMsg" class="auth-msg" role="status"></p>
        <p class="auth-note">Powered by Neon Managed Better Auth. 가입 시 neon_auth 스키마에 프로필이 동기화됩니다.</p>
      </form>
      <a class="auth-back" href="/">← AR 탐험 홈</a>
    </div>
  </div>
  <script type="module" src="/auth/login.mjs"></script>
</body>
</html>
